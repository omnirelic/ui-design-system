# Publication manuelle de @omnirelic/ui-design-system sur GitHub Packages.
# Lancer : Actions > Publish ui-design-system > Run workflow (ou gh workflow run publish.yml --ref dev).
# GITHUB_TOKEN suffit (permission packages: write), aucun jeton personnel.
# Pas de tag git : la version publiée fait foi. Préversion (0.3.0-alpha.2) : dist-tag alpha ; version stable : latest.
name: Publish ui-design-system

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Simulation (rien n'est publié)
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Garde de branche
        run: |
          if [ "$GITHUB_REF" != "refs/heads/dev" ]; then
            echo "::error::Publication autorisée depuis dev uniquement (ref : $GITHUB_REF)."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@omnirelic'
      - name: Installer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Contenu du paquet
        run: npm pack --dry-run
      - name: Version déjà publiée ?
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION est déjà publiée. Incrémenter la version dans package.json (PR vers dev)."
            exit 1
          fi
          echo "$NAME@$VERSION absente du registre, publication possible."
      - name: Publier
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY: ${{ inputs.dry_run }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          FLAGS=""
          case "$VERSION" in *-*) FLAGS="--tag alpha" ;; esac
          if [ "$DRY" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          npm publish $FLAGS
